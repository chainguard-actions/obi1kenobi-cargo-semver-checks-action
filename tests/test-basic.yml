name: Test basic semver check (no violations)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-semver-checks with local baseline (no violations expected)
        id: action
        uses: .
        with:
          manifest-path: tests/fixtures/basic-crate/Cargo.toml
          baseline-root: tests/fixtures/baseline-crate
          rust-toolchain: stable

      - name: Assert action succeeded (no semver violations)
        run: |
          echo "Action completed successfully — no semver violations detected"
          echo "PASS"
