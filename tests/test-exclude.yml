name: Test exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up baseline workspace (copy of current workspace = no API changes)
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/workspace" /tmp/baseline-workspace-exclude

      - id: action
        uses: .
        with:
          manifest-path: tests/fixtures/workspace/Cargo.toml
          exclude: semver-checks-crate-b
          baseline-root: /tmp/baseline-workspace-exclude
          rust-toolchain: stable
          verbose: 'false'

      - name: Assert action succeeded with crate-b excluded
        run: |
          echo "Action completed successfully — checked workspace excluding semver-checks-crate-b, no semver violations detected"
          echo "PASS"
