name: Test feature-group input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-semver-checks with default-features feature group
        id: action
        uses: .
        with:
          manifest-path: tests/fixtures/basic-crate/Cargo.toml
          baseline-root: tests/fixtures/baseline-crate
          rust-toolchain: stable
          feature-group: default-features

      - name: Assert action succeeded with default-features feature group
        run: |
          echo "Action completed successfully with default-features feature group"
          echo "PASS"
