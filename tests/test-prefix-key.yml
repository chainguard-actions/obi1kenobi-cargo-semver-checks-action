name: Test prefix-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-semver-checks with prefix-key for cache namespacing
        id: action
        uses: .
        with:
          manifest-path: tests/fixtures/basic-crate/Cargo.toml
          baseline-root: tests/fixtures/baseline-crate
          rust-toolchain: stable
          prefix-key: test-prefix-v1

      - name: Assert action succeeded with prefix-key input
        run: |
          echo "Action completed successfully with prefix-key input"
          echo "PASS"
