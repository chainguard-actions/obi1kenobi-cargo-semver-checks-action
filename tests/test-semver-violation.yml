name: Test semver violation detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-semver-checks expecting a violation (removed public function)
        id: action
        uses: .
        continue-on-error: true
        with:
          manifest-path: tests/fixtures/breaking-crate/Cargo.toml
          baseline-root: tests/fixtures/baseline-crate
          rust-toolchain: stable

      - name: Assert action detected the semver violation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected semver violation (removed public function)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have detected a semver violation but reported success"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
