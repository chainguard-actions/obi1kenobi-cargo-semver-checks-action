name: Test verbose output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cargo-semver-checks with verbose output enabled
        id: action
        uses: .
        with:
          manifest-path: tests/fixtures/basic-crate/Cargo.toml
          baseline-root: tests/fixtures/baseline-crate
          rust-toolchain: stable
          verbose: 'true'

      - name: Assert action succeeded with verbose mode
        run: |
          echo "Action completed successfully in verbose mode — no semver violations detected"
          echo "PASS"
